---
- name: delete old packets repository
  file:
    path: /tmp/zabbix-release.deb
    state: absent

- name: download zabbix 7.0
  get_url:
    url: "https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb"
    dest: "/tmp/zabbix-release.deb"
    mode: '0644'

- name: install
  apt:
    deb: /tmp/zabbix-release.deb
    state: present

- name: del temp files
  file:
    path: /tmp/zabbix-release.deb
    state: absent

- name: del old agent
  apt:
    name: zabbix-agent
    state: absent
    purge: yes

- name: install zabbix agent2
  apt:
    name: zabbix-agent2
    state: present
    update_cache: yes

- name: copy config files agent
  template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: '0644'

- name: restart_enable zabbix agent
  service:
    name: zabbix-agent2
    state: restarted
    enabled: yes

