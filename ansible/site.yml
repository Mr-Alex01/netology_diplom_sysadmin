---
- name: deploy web's nginx
  hosts: web_servers
  become: yes # от имени root
  roles:
    - nginx

- name: install docker on monitoring and elastic
  hosts: elastic, zabbix, kibana
  become: yes
  roles:
    - docker

- name: deploy elastic and kibana
  hosts: elastic, kibana
  become: yes
  roles:
    - elastic_stack

- name: deploy filebeat on web-servers
  hosts: web_servers
  become: yes
  roles:
    - filebeat

- name: deploy monitoring zabbix
  hosts: zabbix
  become: yes
  roles:
    - zabbix

- name: deploy zabbix agent on all hosts
  hosts: all
  become: yes
  roles:
    - zabbix_agent
